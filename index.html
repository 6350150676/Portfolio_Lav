<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f2ede3" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)" />
        <meta name="description"
                content="Lav's Experiments — the lab notebook of Lav Naruka, game designer & Unity developer. Multiplayer mobile games, XR and gameplay systems, filed as experiments you can open, read and play." />
        <title>Lav's Experiments — Lav Naruka, Game Designer &amp; Unity Developer</title>

        <!-- Social / link previews -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Lav's Experiments — Lav Naruka, Game Designer &amp; Unity Developer" />
        <meta property="og:description"
                content="Multiplayer mobile games, XR and gameplay systems — filed as experiments you can open, read and play." />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..800,0..100,0..1;1,9..144,400..800,0..100,0..1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
                rel="stylesheet">
</head>

<body>
        <script>
                // Apply theme before paint (no flash). Saved choice wins;
                // otherwise follow the visitor's OS preference.
                (function () {
                        try {
                                var t = localStorage.getItem('theme');
                                if (t !== 'light' && t !== 'dark') {
                                        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                                }
                                document.documentElement.setAttribute('data-theme', t);
                        } catch (e) {
                                document.documentElement.setAttribute('data-theme', 'light');
                        }
                })();
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
</body>

</html>
